version: '3'

# Miyoo Mini Flip port tasks. Upstream's own taskfile (upstream/slot/taskfile.yml)
# builds aarch64 for the Anbernic H700 and asserts it; these are the armv7
# counterparts. Everything cross-builds inside toolchain/Dockerfile, which carries
# both the Miyoo Mini gcc (glibc 2.28, the device's own libc) and a pinned Rust.

vars:
  IMAGE: slot-miyoo-toolchain:latest
  TARGET: armv7-unknown-linux-gnueabihf
  UPSTREAM: upstream/slot
  # A plain armv7 glibc userland to run the device build under qemu. Its glibc is
  # newer than the device's 2.28, which is fine for running what we linked.
  ARMBOX: arm32v7/debian:bullseye-slim
  LD: /lib/ld-linux-armhf.so.3
  # The handheld's address on the network, for the deploy/log tasks. Allium
  # serves a writable FTP of the card root, so no SD shuffling is needed.
  # Set it in the environment: SLOT_DEVICE=192.168.1.x task deploy
  DEVICE: '{{.SLOT_DEVICE | default ""}}'
  FTP: 'ftp://{{.SLOT_DEVICE}}'
  # How long device:check waits for the handheld, which drops its WiFi when it
  # sleeps. 0 checks once; SLOT_WAIT_S=120 rides out a nap.
  WAIT_S: '{{.SLOT_WAIT_S | default "0"}}'

  # The renderer to build. "software" is the framebuffer rasteriser this device
  # needs; pass GFX= to build the GL path instead, which the Mini Flip cannot run.
  GFX: software
  TIMEOUT: '20'

  # Kept in step with upstream/slot/taskfile.yml. Bump both together.
  MGBA_COMMIT: e31759b24e7a4e3899285ff720d7b573ac328ae7
  GPSP_COMMIT: 7b2dd37394e2822110cacef321e9bb291a305b77

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds: [task --list]

  image:
    desc: Build the cross toolchain image (Miyoo gcc + pinned Rust + armv7 target)
    sources: [toolchain/Dockerfile]
    cmds:
      - docker build -t {{.IMAGE}} toolchain/
      - docker run --rm {{.IMAGE}} bash -c 'cargo --version && arm-linux-gnueabihf-gcc -dumpmachine'

  sh:
    desc: Run CMD in the toolchain container as the calling user
    internal: true
    requires:
      vars: [CMD]
    cmds:
      - >-
        docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src
        -e HOME=/tmp -e CARGO_HOME=/src/.cargo-home {{.IMAGE}}
        bash -c '{{.CMD}}'

  shell:
    desc: Interactive shell in the toolchain container
    cmds:
      - >-
        docker run --rm -it -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src
        -e HOME=/tmp -e CARGO_HOME=/src/.cargo-home {{.IMAGE}} bash

  patch:
    desc: Apply this port's patches to the upstream submodule working tree
    cmds:
      # Absolute paths: git -C changes directory, so a repo-relative patch path
      # would not resolve. Idempotent via --reverse --check, and a patch that
      # neither applies nor is already applied is a hard error, not a skip.
      - |
        set -eu
        for p in "$PWD"/patches/*.patch; do
          if git -C {{.UPSTREAM}} apply --reverse --check "$p" 2>/dev/null; then
            echo "already applied $(basename "$p")"
          elif git -C {{.UPSTREAM}} apply "$p"; then
            echo "applied $(basename "$p")"
          else
            echo "STALE: $(basename "$p") does not apply to $(git -C {{.UPSTREAM}} rev-parse --short HEAD)" >&2
            exit 1
          fi
        done

  unpatch:
    desc: Discard all local changes in the upstream submodule, back to the pinned commit
    cmds:
      # reset first: generating a patch for added files needs `git add -N`, which
      # leaves them staged, and a staged file is not untracked so clean skips it.
      - git -C {{.UPSTREAM}} reset -q
      - git -C {{.UPSTREAM}} checkout -- .
      # checkout only reverts tracked files; a patch that adds new ones (the
      # software backend adds crates/slot-gfx/src/soft/) would leave them behind
      # and then fail to re-apply. The submodule is pinned and pristine, so
      # anything untracked in it came from patches/ and should go.
      - git -C {{.UPSTREAM}} clean -qfd
      - 'echo "{{.UPSTREAM}} is back at $(git -C {{.UPSTREAM}} rev-parse --short HEAD), clean"'

  core:gpsp:
    desc: Build gpsp_libretro.so for armv7 (ARM JIT — the GBA core that stands a chance)
    deps: [image]
    status:
      - test -f vendor-miyoo/gpsp_libretro.so
      - test "$(cat vendor-miyoo/gpsp_libretro.so.meta 2>/dev/null)" = "$(sh cores/gpsp/build-miyoo.sh stamp {{.GPSP_COMMIT}})"
    cmds:
      - mkdir -p third-party vendor-miyoo
      - test -f third-party/gpsp-src.tar.gz || curl -fsSL -o third-party/gpsp-src.tar.gz "https://github.com/libretro/gpsp/archive/{{.GPSP_COMMIT}}.tar.gz"
      - task: sh
        vars:
          CMD: sh cores/gpsp/build-miyoo.sh build {{.GPSP_COMMIT}} third-party/gpsp-src.tar.gz target-miyoo/gpsp vendor-miyoo/gpsp_libretro.so
      - task: verify:arm
        vars: {FILE: vendor-miyoo/gpsp_libretro.so}
      # See the note in cores/gpsp/build-miyoo.sh: gpSP's Makefile silently skips
      # -static-libgcc/-static-libstdc++ on this toolchain. Harmless only as long
      # as the core really needs nothing beyond libc and libm, so assert that.
      - task: sh
        vars:
          CMD: >-
            ! arm-linux-gnueabihf-readelf -d vendor-miyoo/gpsp_libretro.so
            | grep -E "NEEDED.*(libstdc\+\+|libgcc_s)"

  core:mgba:
    desc: Build mgba_libretro.so for armv7
    deps: [image]
    status:
      - test -f vendor-miyoo/mgba_libretro.so
      - test "$(cat vendor-miyoo/mgba_libretro.so.meta 2>/dev/null)" = "$(sh cores/mgba/build-miyoo.sh stamp {{.MGBA_COMMIT}})"
    cmds:
      - mkdir -p vendor-miyoo
      - task: sh
        vars:
          CMD: sh cores/mgba/build-miyoo.sh build {{.MGBA_COMMIT}} target-miyoo/mgba vendor-miyoo/mgba_libretro.so
      - task: verify:arm
        vars: {FILE: vendor-miyoo/mgba_libretro.so}

  shim:
    desc: >-
      Build System/libslotao.so, the MI_AO audio shim. slot dlopens it the same
      way it dlopens libasound, so the cargo build needs no C toolchain and no
      vendor SDK
    deps: [image]
    status:
      - test -f vendor-miyoo/libslotao.so
      - test vendor-miyoo/libslotao.so -nt shim/slotao.c
    cmds:
      - mkdir -p third-party vendor-miyoo
      # The Miyoo SDK sysroot, for mi_ao.h and libmi_ao. Same tarball Allium
      # uses, from shauninman's toolchain-buildroot.
      - test -d third-party/my283 || { curl -fsSL -o third-party/my283.tar.xz https://github.com/shauninman/miyoomini-toolchain-buildroot/raw/main/support/my283.tar.xz && tar -xJf third-party/my283.tar.xz -C third-party/; }
      - task: sh
        vars:
          CMD: >-
            ${CROSS_COMPILE}gcc -shared -fPIC -O2
            -march=armv7ve -mtune=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard
            -I third-party/my283/usr/include
            -o vendor-miyoo/libslotao.so shim/slotao.c
            -L third-party/my283/usr/lib
            -lmi_ao -lmi_sys -lcam_os_wrapper
      - task: verify:arm
        vars: {FILE: vendor-miyoo/libslotao.so}
      - task: sh
        vars:
          CMD: >-
            ${CROSS_COMPILE}nm -D --defined-only vendor-miyoo/libslotao.so | grep -c slotao_

  cores:
    desc: Build both libretro cores for armv7
    cmds:
      - task: core:gpsp
      - task: core:mgba

  build:
    desc: Build the slot binary for armv7
    deps: [image, patch]
    cmds:
      - task: sh
        vars:
          CMD: >-
            cd {{.UPSTREAM}} && cargo build --target {{.TARGET}} --profile device
            --target-dir /src/target-miyoo/rust -p slot --no-default-features
            --features device,{{.GFX}},miyoo
      - task: verify:arm
        vars: {FILE: 'target-miyoo/rust/{{.TARGET}}/device/slot'}

  verify:arm:
    desc: Assert FILE is a 32-bit ARM object the device can load
    internal: true
    requires:
      vars: [FILE]
    cmds:
      # Upstream greps for aarch64 at the same points; this is the armv7 guard.
      - file {{.FILE}} | grep -q "ELF 32-bit LSB .*ARM"
      - task: sh
        vars:
          CMD: >-
            arm-linux-gnueabihf-readelf -A {{.FILE}} | grep -q "Tag_CPU_arch: v7" &&
            arm-linux-gnueabihf-readelf -A {{.FILE}} | grep -q "Tag_ABI_VFP_args: VFP registers"
      - 'echo "{{.FILE}}: armv7-a hard-float, ok"'

  glibc:
    desc: Print the highest glibc version the built binary needs (device must be >= this)
    cmds:
      - task: sh
        vars:
          CMD: >-
            arm-linux-gnueabihf-readelf -V target-miyoo/rust/{{.TARGET}}/device/slot
            | grep -oE "GLIBC_[0-9.]+" | sort -uV | tail -1

  dist:
    desc: Assemble the copy-to-SD-card tree, OUT defaults to ./dist
    deps: [cores, shim, build]
    vars:
      OUT: '{{.OUT | default "dist"}}'
    cmds:
      - rm -rf {{.OUT}}
      # The content root, taken from upstream's own DIRS list rather than a copy
      # of it, so an upstream change cannot silently go stale here. Upstream makes
      # these with `slot --init-root`, which we cannot run: the binary is armv7 and
      # the build host is not.
      - |
        set -eu
        dirs=$(sed -n '/^pub const DIRS/,/^];/p' {{.UPSTREAM}}/crates/slot/src/root.rs                | grep -oE '"[^"]+"' | tr -d '"')
        n=$(echo "$dirs" | grep -c .)
        [ "$n" = 20 ] || { echo "expected 20 dirs from root.rs, got $n" >&2; exit 1; }
        for d in $dirs; do mkdir -p "{{.OUT}}/$d"; done
        echo "content root: $n directories"
      # Both launcher layouts: App/<Name>/ for stock and Onion, Apps/<Name>.pak/
      # for Allium. The launcher that isn't in use simply ignores the other.
      - cp -R card/App {{.OUT}}/App
      - cp -R card/Apps {{.OUT}}/Apps
      # Upstream's own card scripts first -- slot shells out to slotlink.sh and
      # friends, and logs an error for each one it cannot find -- then ours on
      # top, which replaces its launch_frontend.sh with the armv7 one.
      - cp -R {{.UPSTREAM}}/card/System/. {{.OUT}}/System/
      # Ours last, so they win over the upstream copies above:
      # launch_frontend.sh is the armv7 one, and slotlink.sh is the
      # single-interface 2.4 GHz radio this device has rather than the
      # Anbernic's dual-interface 5 GHz one.
      - cp card/System/launch_frontend.sh card/System/slotlink.sh card/System/probe.sh card/System/probe-run.sh card/System/linkprobe.sh card/System/net-up.sh card/System/coresave-miyoo.sh {{.OUT}}/System/
      - cp target-miyoo/rust/{{.TARGET}}/device/slot {{.OUT}}/System/slot
      - cp vendor-miyoo/gpsp_libretro.so vendor-miyoo/mgba_libretro.so {{.OUT}}/System/
      - cp vendor-miyoo/libslotao.so {{.OUT}}/System/
      - chmod +x {{.OUT}}/System/slot {{.OUT}}/System/*.sh {{.OUT}}/App/*/launch.sh {{.OUT}}/Apps/*/launch.sh
      # GPL-3.0: ship the licence texts and the cores' corresponding source refs.
      - cp -R {{.UPSTREAM}}/licenses {{.OUT}}/System/licenses
      - cp vendor-miyoo/gpsp_libretro.so.meta vendor-miyoo/mgba_libretro.so.meta {{.OUT}}/System/licenses/
      - cp third-party/gpsp-src.tar.gz {{.OUT}}/System/licenses/
      # What built this tree, travelling with it. The cores already ship their
      # own .meta stamps above; this is the frontend's provenance, which nothing
      # recorded. A card found months from now should be able to name the commit
      # and the compiler that produced it without the repo to hand -- and the
      # toolchain digest is read out of the Dockerfile rather than retyped, so
      # it cannot drift from the image that was actually used.
      - |
        set -eu
        out={{.OUT}}/System/licenses/build-info.txt
        {
          echo "slot-miyoo $(git describe --tags --always --dirty 2>/dev/null || echo unknown)"
          echo "built       $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "toolchain   $(sed -n 's|^FROM ||p' toolchain/Dockerfile)"
          echo "mgba        {{.MGBA_COMMIT}}"
          echo "gpsp        {{.GPSP_COMMIT}}"
          echo "target      {{.TARGET}}"
        } > "$out"
        cat "$out"
      - 'echo "tree ready at {{.OUT}} — copy its *contents* to the card root"'

  release:
    desc: Build the one zip a user installs, OUT defaults to ./release
    vars:
      OUT: '{{.OUT | default "release"}}'
      # Tag if we are on one, otherwise the short sha, so an unreleased build
      # still names the commit it came from rather than claiming a version.
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo unknown
    cmds:
      # A clean tree, because the two traps in CLAUDE.md were both found by
      # rebuilding from clean, and a release is the worst place to hit them.
      - task: clean
      - task: dist
        vars: {OUT: '{{.OUT}}/stage'}
      # The install page travels with the zip: whoever unpacks this on a card
      # months from now will not have the repo in front of them.
      - cp docs/INSTALL.md {{.OUT}}/stage/System/slot-install.md
      # Zipped from inside the stage dir so the paths are card-root relative --
      # App/, Apps/, System/ at the top level, no wrapper directory. Getting
      # this wrong is the one mistake that makes the app not appear.
      - |
        set -eu
        zip="slot-miyoo-{{.VERSION}}-flip.zip"
        rm -f "{{.OUT}}/$zip"
        (cd {{.OUT}}/stage && zip -qr "../$zip" .)
        cd {{.OUT}}
        echo "$zip"
        echo "  $(du -h "$zip" | cut -f1), $(unzip -l "$zip" | tail -1 | awk '{print $2}') files"
        echo "  top level: $(unzip -l "$zip" | awk '$4 ~ /\// {split($4,a,"/"); print a[1]}' | sort -u | tr '\n' ' ')"
        echo "unzip it into the card root; see docs/INSTALL.md"

  probe:
    desc: Assemble just the probe app, OUT defaults to ./dist-probe (no build needed)
    vars:
      OUT: '{{.OUT | default "dist-probe"}}'
    cmds:
      - rm -rf {{.OUT}}
      - mkdir -p {{.OUT}}/App {{.OUT}}/Apps {{.OUT}}/System
      - cp -R card/App/SlotProbe {{.OUT}}/App/
      - cp -R "card/Apps/slot probe.pak" {{.OUT}}/Apps/
      - cp card/System/probe.sh card/System/probe-run.sh {{.OUT}}/System/
      - chmod +x {{.OUT}}/System/*.sh {{.OUT}}/App/SlotProbe/launch.sh {{.OUT}}/Apps/*/launch.sh
      - 'echo "probe ready at {{.OUT}} — copy its contents to the card root, run \"slot probe\" on the device, then read slot-probe.txt off the card"'

  binfmt:
    desc: Register the qemu armv7 handler so the device binary runs on this machine
    status:
      - docker run --rm --platform linux/arm/v7 {{.ARMBOX}} true
    cmds:
      # Needs Docker, not root: the registration happens inside a privileged
      # container writing /proc/sys/fs/binfmt_misc. It is host-wide and survives
      # until reboot. To undo: docker run --privileged --rm tonistiigi/binfmt --uninstall arm
      - docker run --privileged --rm tonistiigi/binfmt:qemu-v8.1.5 --install arm
      - docker run --rm --platform linux/arm/v7 {{.ARMBOX}} uname -m

  run:qemu:
    desc: >-
      Run the armv7 device build on this machine under qemu. It gets as far as
      needing EGL and stops there, which is the point: it is the rasteriser's
      dev loop, no handheld required
    deps: [binfmt, build, cores]
    cmds:
      - mkdir -p target-miyoo/qemu-root
      - >-
        docker run --rm --platform linux/arm/v7 -v "$PWD":/src -w /src {{.ARMBOX}}
        bash -c '
        set -e;
        root=/src/target-miyoo/qemu-root;
        bin=/src/target-miyoo/rust/{{.TARGET}}/device/slot;
        {{.LD}} $bin --init-root $root >/dev/null;
        cp /src/vendor-miyoo/*.so $root/System/;
        echo "glibc here: $(ldd --version | head -1)";
        SLOT_ROOT=$root timeout {{.TIMEOUT}} {{.LD}} $bin 2>&1 | tail -30'

  verify:root:
    desc: >-
      Prove the content root `task dist` derives from root.rs matches what slot
      itself creates with --init-root. Needs qemu; dist deliberately does not
    deps: [binfmt, build]
    cmds:
      - rm -rf target-miyoo/root-check
      - >-
        docker run --rm --platform linux/arm/v7 -v "$PWD":/src -w /src {{.ARMBOX}}
        {{.LD}} /src/target-miyoo/rust/{{.TARGET}}/device/slot
        --init-root /src/target-miyoo/root-check
      - task: dist
        vars: {OUT: target-miyoo/root-dist}
      - |
        set -eu
        a=$(cd target-miyoo/root-check && find . -type d | sort)
        b=$(cd target-miyoo/root-dist && find . -type d -not -path './App*' -not -path './System/licenses*' | sort)
        if [ "$a" = "$b" ]; then
          echo "content root matches slot --init-root exactly"
        else
          echo "MISMATCH between dist and slot --init-root:" >&2
          diff <(echo "$a") <(echo "$b") >&2 || true
          exit 1
        fi

  shot:
    desc: >-
      Render a frame under qemu into a file-backed panel and save it as a PNG.
      The only way to see what the software rasteriser draws without the handheld
    deps: [binfmt, build]
    vars:
      SIZE: '{{.SIZE | default "752x560"}}'
      OUT: '{{.OUT | default "target-miyoo/frame.png"}}'
    cmds:
      - >-
        docker run --rm --platform linux/arm/v7 -v "$PWD":/src -w /src {{.ARMBOX}}
        bash -c '
        set -e;
        root=/src/target-miyoo/shot-root;
        bin=/src/target-miyoo/rust/{{.TARGET}}/device/slot;
        rm -rf $root;
        {{.LD}} $bin --init-root $root >/dev/null;
        cp /src/vendor-miyoo/*.so $root/System/ 2>/dev/null || true;
        : > /src/target-miyoo/fb.raw;
        SLOT_ROOT=$root SLOT_FB=/src/target-miyoo/fb.raw SLOT_FB_SIZE={{.SIZE}}
        timeout {{.TIMEOUT}} {{.LD}} $bin 2>&1 | tail -5'
      - python3 -I tools/fb2png.py target-miyoo/fb.raw {{.SIZE}} 0 {{.OUT}}

  test:
    desc: >-
      Run the workspace tests as armv7 under qemu, which is the only way to
      exercise the NEON kernel and anything else that is 32-bit specific
    deps: [image, binfmt, patch]
    cmds:
      - task: sh
        vars:
          CMD: >-
            cd {{.UPSTREAM}} && QEMU_LD_PREFIX=/opt/miyoomini-toolchain/arm-linux-gnueabihf/libc
            cargo test -p slot-gfx -p slot-power --lib --target {{.TARGET}}
            --no-default-features --features software
      # The card scripts too. These run on the build host, not under qemu --
      # they are busybox sh, and busybox is where they have to be right.
      - task: test:card

  test:card:
    desc: Run the card scripts' own tests under a real busybox
    cmds:
      # busybox, not the host shell: the host is fish with GNU coreutils
      # behind it and will happily accept what the device cannot run.
      - docker run --rm -v "$PWD":/src busybox:1.36 sh /src/card/test-slotlink-miyoo.sh
      # Syntax alone for the rest, which all want a device to do anything.
      - |
        set -eu
        for f in card/System/*.sh card/App/*/launch.sh card/Apps/*/launch.sh; do
          docker run --rm -v "$PWD":/src busybox:1.36 sh -n "/src/$f" \
            || { echo "busybox cannot parse $f" >&2; exit 1; }
        done
        echo "card scripts: all parse under busybox"

  device:find:
    desc: >-
      Find the handheld on the local /24 by its FTP port. Its address is DHCP
      and does move -- a whole round of "the device is off the network" was
      really the device sitting on a different address
    cmds:
      - |
        set -eu
        # The handheld's /24, taken from SLOT_DEVICE -- which is the last
        # address it had, and DHCP moves it within that subnet rather than off
        # it. Asked for rather than guessed at from this machine's addresses:
        # a build host with Docker has dozens of them (an earlier note here
        # mistook docker0's 10.200.0.0/24 for the link and concluded the
        # handheld was behind a router), and picking the wrong one makes every
        # probe time out instead of refusing, which looks conclusive.
        #
        # Nothing answering does not mean the handheld is off. FTP comes from
        # net-up.sh, which .tmp_update/updater backgrounds at boot when
        # .slot-net is on the card -- so it is coming, but the radio needs
        # about a minute from cold and drops a handshake or two first. Sweep
        # again before concluding anything.
        want="{{.DEVICE}}"
        if [ -z "$want" ]; then
          echo "set SLOT_DEVICE to any address on the handheld's subnet, e.g. SLOT_DEVICE=192.168.1.1" >&2
          exit 1
        fi
        base=${want%.*}
        # A sweep of 254 hosts in parallel takes about a second, which is the
        # trap: it is a snapshot dressed up as a search. The handheld needs
        # ~85 s from cold to get through the DHCP and the two dropped
        # handshakes its radio does before COMPLETED, and a sweep run inside
        # that window finds nothing and looks conclusive. It did exactly that
        # once, and the empty result was then reported as "the device is not on
        # the network" while it was seconds from associating.
        #
        # So sweep repeatedly for SLOT_WAIT_S (default 150, past the 85) and
        # stop at the first answer.
        limit={{.WAIT_S}}
        [ "$limit" -lt 150 ] && limit=150
        echo "looking for the handheld on $base.0/24, for up to ${limit}s..." >&2
        waited=0
        while :; do
          # A TCP connect per host, in parallel, with a short timeout. nc is
          # the right tool but is not always installed, hence the bash
          # redirect. The whole group is redirected, not `wait`: the children
          # inherit the group's stdout and `wait` has none of their output.
          {
            for i in $(seq 1 254); do
              (
                if timeout 1 bash -c "exec 3<>/dev/tcp/$base.$i/21" 2>/dev/null; then
                  echo "$base.$i"
                fi
              ) &
            done
            wait
          } > /tmp/slot-sweep.$$ 2>/dev/null
          if [ -s /tmp/slot-sweep.$$ ]; then
            cat /tmp/slot-sweep.$$
            rm -f /tmp/slot-sweep.$$
            break
          fi
          rm -f /tmp/slot-sweep.$$
          if [ "$waited" -ge "$limit" ]; then
            echo "nothing answered FTP in ${waited}s." >&2
            echo "the handheld brings FTP up itself at boot (.tmp_update/updater, .slot-net)," >&2
            echo "so if it is on and still absent, check the radio: slot-net.txt on the card." >&2
            exit 1
          fi
          sleep 5
          waited=$((waited + 6))
        done
      - 'echo "the address above answers FTP; the handheld also writes its own into slot-net.txt on the card" >&2'

  device:check:
    desc: >-
      Wait for the handheld to answer on FTP, up to SLOT_WAIT_S seconds
      (default 0, i.e. check once). The handheld drops its WiFi when it sleeps,
      so a wait makes deploys survive it nodding off
    cmds:
      - |
        set -eu
        if [ -z "{{.DEVICE}}" ]; then
          echo "set SLOT_DEVICE to the handheld's IP, e.g. SLOT_DEVICE=192.168.1.42 task deploy" >&2
          exit 1
        fi
        waited=0
        limit={{.WAIT_S}}
        until curl -s --connect-timeout 3 --list-only "{{.FTP}}/" >/dev/null; do
          if [ "$waited" -ge "$limit" ]; then
            echo "no FTP on {{.DEVICE}}:21 after ${waited}s." >&2
            echo "wake the handheld: it loses the link when it sleeps, and brings FTP" >&2
            echo "back by itself about 85s after a boot (.tmp_update/updater, .slot-net)." >&2
            echo "to wait for it instead: SLOT_WAIT_S=120 task <whatever>" >&2
            echo "the address is DHCP and does move -- 'task device:find' looks for it." >&2
            exit 1
          fi
          [ "$waited" = 0 ] && echo "waiting for {{.DEVICE}} to answer..." >&2
          sleep 3
          waited=$((waited + 3))
        done
        [ "$waited" -gt 0 ] && echo "{{.DEVICE}} answered after ${waited}s" >&2 || true

  deploy:
    desc: >-
      Push the built frontend, the audio shim and the card scripts to the
      handheld over Allium's FTP, instead of moving the SD card. Needs
      SLOT_DEVICE set
    deps: [device:check, shim, build]
    cmds:
      # Upload beside the live binary, then rename over it. FTP truncates on
      # open, so writing straight to System/slot pulls the pages out from under
      # a running slot and hangs the handheld -- which it did, once slot became
      # the boot process rather than something launched per session. A rename is
      # atomic and leaves the running process on the old inode.
      - curl -sS -T target-miyoo/rust/{{.TARGET}}/device/slot "{{.FTP}}/System/slot.new"
      - >-
        sh tools/device-sh.sh {{.DEVICE}}
        'cd /mnt/SDCARD/System && [ -s slot.new ] && chmod 755 slot.new && mv slot.new slot && echo renamed || echo "upload incomplete, left slot alone"'
      - curl -sS -T card/System/launch_frontend.sh "{{.FTP}}/System/launch_frontend.sh"
      - curl -sS -T card/System/probe.sh "{{.FTP}}/System/probe.sh"
      - curl -sS -T card/System/net-up.sh "{{.FTP}}/System/net-up.sh"
      - curl -sS -T card/System/coresave-miyoo.sh "{{.FTP}}/System/coresave-miyoo.sh"
      - curl -sS -T card/System/coresave.sh "{{.FTP}}/System/coresave.sh" 2>/dev/null || true
      # Same staging as the binary, and for the same reason: FTP truncates on
      # open, and this library is dlopen'ed -- so writing straight over it pulls
      # the mapped pages out from under the running audio thread. That is
      # SIGBUS/SIGSEGV in slot-audio-miao, and it accounted for 15 of the 16
      # crashes in crash/exits.log before anyone noticed, every one of them
      # blamed on the audio work going on at the time.
      - curl -sS -T vendor-miyoo/libslotao.so "{{.FTP}}/System/libslotao.so.new"
      - >-
        sh tools/device-sh.sh {{.DEVICE}}
        'cd /mnt/SDCARD/System && [ -s libslotao.so.new ] && mv libslotao.so.new libslotao.so && echo renamed || echo "upload incomplete, left libslotao.so alone"'
      - 'echo "pushed to {{.DEVICE}} — relaunch slot on the handheld"'

  deploy:cores:
    desc: Push the two libretro cores as well, which rarely change
    deps: [device:check, cores]
    cmds:
      # Staged and renamed, like the binary and the shim: these are dlopen'ed,
      # so truncating one under a running slot is a crash in slot-emu.
      - curl -sS -T vendor-miyoo/gpsp_libretro.so "{{.FTP}}/System/gpsp_libretro.so.new"
      - curl -sS -T vendor-miyoo/mgba_libretro.so "{{.FTP}}/System/mgba_libretro.so.new"
      - >-
        sh tools/device-sh.sh {{.DEVICE}}
        'cd /mnt/SDCARD/System; for c in gpsp mgba; do
        [ -s $c\_libretro.so.new ] && mv $c\_libretro.so.new $c\_libretro.so && echo "renamed $c" || echo "upload incomplete, left $c alone"; done'

  sh:device:
    desc: >-
      Run CMD on the handheld over Allium's telnet, e.g.
      SLOT_DEVICE=192.168.1.x task sh:device CMD='cat /proc/meminfo'
    deps: [device:check]
    requires:
      vars: [CMD]
    cmds:
      - sh tools/device-sh.sh {{.DEVICE}} '{{.CMD}}'

  boot:install:
    desc: >-
      Install the card's boot hook so slot can start instead of Allium. Kept out
      of `dist` and `deploy` on purpose: it is boot-critical, and a routine copy
      should never touch it
    deps: [device:check]
    cmds:
      - curl -sS -T card/.tmp_update/updater "{{.FTP}}/.tmp_update/updater.slot"
      - >-
        sh tools/device-sh.sh {{.DEVICE}}
        'cd /mnt/SDCARD/.tmp_update; [ -f updater.allium-orig ] || cp updater updater.allium-orig;
        cp updater.slot updater; chmod 755 updater; rm -f updater.slot; grep -c slot-boot updater'
      - 'echo "installed (a count of 2 above is right). Allium still boots until .slot-boot exists"'

  boot:slot:
    desc: Boot into slot from now on, with the network up alongside it
    deps: [device:check]
    cmds:
      - sh tools/device-sh.sh {{.DEVICE}} 'touch /mnt/SDCARD/.slot-boot /mnt/SDCARD/.slot-net; ls /mnt/SDCARD/.slot-boot /mnt/SDCARD/.slot-net'
      - 'echo "slot boots next time. task boot:allium undoes it, as does deleting .slot-boot from any computer"'

  boot:allium:
    desc: Go back to booting Allium
    deps: [device:check]
    cmds:
      - sh tools/device-sh.sh {{.DEVICE}} 'rm -f /mnt/SDCARD/.slot-boot; echo removed'
      - 'echo "Allium boots next time"'

  stop:
    desc: >-
      Stop slot on the handheld and hand the screen back to Allium. slot has no
      quit of its own -- its power menu only offers Restart and Power Off, since
      on the Anbernic handhelds it *is* the launcher -- so rebooting is
      otherwise the only way out
    deps: [device:check]
    cmds:
      # Not `killall slot`: slot is started through the loader, so the process
      # name is ld-linux-armhf.so.3 and killall matches nothing. This busybox
      # has no `pkill -f` either, so find the pid from ps. A plain TERM has been
      # seen not to shift it, hence the KILL follow-up.
      - |
        sh tools/device-sh.sh {{.DEVICE}} 'for s in TERM KILL; do pid=$(ps | grep "[S]ystem/slot" | head -1 | tr -s " " | cut -d" " -f2); [ -z "$pid" ] && break; kill -$s "$pid"; sleep 2; done; ps | grep -c "[S]ystem/slot"'
      - 'echo "(a count of 0 above means it stopped; alliumd comes back with it)"'

  crashes:
    desc: Fetch the crash and exit records off the handheld
    deps: [device:check]
    cmds:
      - mkdir -p device-dump/crash
      - curl -sS -o device-dump/crash/exits.log "{{.FTP}}/crash/exits.log" || true
      - curl -sS -o device-dump/crash/cores.log "{{.FTP}}/crash/cores.log" || true
      - 'echo "--- exits (status > 128 means a signal killed it) ---"'
      - tail -20 device-dump/crash/exits.log 2>/dev/null || echo "(none yet)"
      - 'echo "--- cores ---"'
      - tail -10 device-dump/crash/cores.log 2>/dev/null || echo "(none yet)"

  log:
    desc: Fetch slot.log (and any traces) off the handheld over FTP
    deps: [device:check]
    cmds:
      - mkdir -p device-dump
      - curl -sS -o device-dump/slot.log "{{.FTP}}/slot.log"
      - curl -sS -o device-dump/input-trace.log "{{.FTP}}/input-trace.log" || true
      - 'echo "--- stages ---"'
      - grep "soft:" device-dump/slot.log | tail -3 || true
      - 'echo "--- frame ---"'
      - grep "latency:" device-dump/slot.log | tail -3 || true

  all:
    desc: Build the cores and the frontend for armv7
    cmds:
      - task: cores
      - task: build

  clean:
    desc: Remove this port's build output (leaves the cargo cache)
    cmds:
      - docker run --rm -v "$PWD":/src -w /src {{.IMAGE}} rm -rf /src/target-miyoo /src/vendor-miyoo
      - task: unpatch
